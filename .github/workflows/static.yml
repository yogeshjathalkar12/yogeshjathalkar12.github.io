# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- NEW STEP: Checking for broken links ---
      - name: Check for broken links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # This tells it to look at all HTML files in your repo.
          # raptor-app/ is excluded - it's the React app's SOURCE (see
          # raptor-app/MANUAL_DEPLOY.md), never served as-is; only its
          # built output under ventures/raptor/app/ actually goes live,
          # and that output's root-relative asset links can't be resolved
          # by Lychee without a --root-dir pointing at the real site root,
          # which this checkout doesn't set up. ventures/raptor/app itself
          # stays checked since it's real, deployed HTML.
          # ventures/sentinel/sampati isn't built yet - arsenal/index.html's
          # "View Project" button links forward to it on purpose (same
          # pattern as the other in-evaluation defense projects on that
          # page); excluded here rather than removed or faked.
          args: "./**/*.html --exclude-path raptor-app --exclude 'https://shoonyaorigins.com/ventures/sentinel/sampati/'"
          # This forces the pipeline to STOP and FAIL if it finds a broken link
          fail: true
      # -------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
