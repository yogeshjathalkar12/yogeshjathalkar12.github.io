<style>:root{--bg:#f7f3ec;--ink:#2a2523;--grout:#c2570f;--grout-d:#8f3f08;--card:#fff;--edge:#e6dfd3;}@media (prefers-color-scheme:dark){:root{--bg:#1c1816;--ink:#f4eee6;--card:#26211f;--edge:#3a3330;}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{margin:0;height:100%;}html,body{height:100dvh;overflow:hidden;}body{--sw:min(100vw,calc((100dvh - 78px) * 16 / 9));background:#14110f;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;user-select:none;}#stage{position:relative;width:var(--sw);aspect-ratio:16/9;overflow:hidden;background:#cfe3ea;}canvas{width:100%;height:100%;display:block;}#caption{position:absolute;left:10px;right:10px;bottom:42px;text-align:center;font-weight:700;font-size:clamp(12px,2.6vw,20px);color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.75);pointer-events:none;min-height:1.4em;}.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,16,14,.82);color:#fff;text-align:center;padding:16px;}.overlay.on{display:flex;}.overlay h2{margin:0;font-size:clamp(1.3rem,4.4vw,2.4rem);line-height:1.15;}.overlay p{margin:0;font-size:clamp(.95rem,2.4vw,1.2rem);opacity:.9;max-width:28em;}#ovTitle{background:transparent;justify-content:space-between;padding:6% 16px 5%;pointer-events:none;}#ovTitle h1{margin:0;font-size:clamp(1.5rem,6.4vw,3.6rem);line-height:1.1;letter-spacing:-.02em;color:#2a2523;text-shadow:0 2px 0 rgba(255,255,255,.7);}#ovTitle h1 em{font-style:normal;color:var(--grout);}#ovTitle .btn{pointer-events:auto;}.btn{background:var(--grout);color:#fff;border:0;border-radius:12px;font-weight:800;font-size:1.05rem;padding:12px 28px;cursor:pointer;touch-action:manipulation;}.btn.alt{background:#4a403a;}.btn:active{background:var(--grout-d);}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}#controls{width:var(--sw);display:flex;gap:8px;padding:0 8px;}#controls button{flex:1;height:68px;border:0;border-radius:16px;font-size:clamp(.8rem,3.2vw,1.1rem);font-weight:800;color:#fff;touch-action:none;cursor:pointer;}#bhar{background:var(--grout);}#jump{background:#35508a;}#crouch{background:#4d6b52;}#sup{background:#6b2fa0;opacity:.35;}#sup.ready{opacity:1;box-shadow:0 0 0 3px #ffd34d,0 0 18px #ffd34d;}#controls button.down{filter:brightness(.8);transform:scale(.98);}#hint{display:none;}#fs{position:absolute;right:92px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;z-index:3;}body.m-title #controls,body.m-title #hint,body.m-intro #controls,body.m-intro #hint{visibility:hidden;}#snd{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;z-index:3;}</style>

<body class="m-title">
<div id="stage">
  <canvas id="c" width="800" height="450"></canvas>
  <div id="caption"></div>
  <button id="snd" aria-label="Toggle sound">Sound on</button>
  <button id="fs" aria-label="Full screen">Full screen</button>

  <div class="overlay on" id="ovTitle">
    <h1>When in doubt, <em>bhar do grout</em></h1>
    <button class="btn" id="startBtn">Start</button>
  </div>
  <div class="overlay" id="ovFail">
    <h2 id="failMsg">Thoda grout kam pada.</h2>
    <button class="btn" id="retryBtn">Try again</button>
  </div>
  <div class="overlay" id="ovWin">
    <h2>Thekedar defeated!</h2>
    <p><b>Thekedar:</b> Theek hai... chalega.<br><b>Mistri:</b> Chalega nahi, daudega.</p>
    <p id="stats"></p>
    <div class="row">
      <button class="btn" id="shareBtn">Share my card</button>
      <button class="btn alt" id="againBtn">Play again</button>
    </div>
    <p style="font-size:.85rem;opacity:.7">Floor 2: The Crooked Staircase, coming soon</p>
  </div>
</div>

<div id="controls">
  <button id="bhar" aria-label="Bhar do">BHAR DO</button>
  <button id="crouch" aria-label="Crouch">CROUCH</button>
  <button id="jump" aria-label="Jump">JUMP</button>
  <button id="sup" aria-label="Super move">SUPER</button>
</div>
<div id="hint">Tap BHAR DO to fill a gap ahead. Jump the bricks, but don't jump into the high pillars. At the end, fight Thekedar.</div>
