<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320" role="img" aria-label="Thekedar, a cartoon angry contractor with a clipboard and a neat hair parting">
  <ellipse cx="110" cy="308" rx="60" ry="8" fill="#000" opacity=".18"/>
  <!-- legs -->
  <rect x="72" y="228" width="30" height="66" rx="8" fill="#4a3f36"/>
  <rect x="118" y="228" width="30" height="66" rx="8" fill="#4a3f36"/>
  <path d="M64 293 h42 v12 h-48 z" fill="#1f1a17"/>
  <path d="M116 293 h42 v12 h-36 z" fill="#1f1a17"/>
  <!-- body (big belly, formal shirt) -->
  <ellipse cx="110" cy="190" rx="62" ry="64" fill="#f2f0ea"/>
  <path d="M110 128 v124" stroke="#d6d2c8" stroke-width="2"/>
  <circle cx="110" cy="150" r="2.5" fill="#9a958a"/>
  <circle cx="110" cy="180" r="2.5" fill="#9a958a"/>
  <circle cx="110" cy="210" r="2.5" fill="#9a958a"/>
  <!-- belt -->
  <rect x="52" y="226" width="116" height="10" rx="5" fill="#2a2523"/>
  <rect x="104" y="224" width="12" height="14" rx="2" fill="#c9a227"/>
  <!-- tie -->
  <path d="M110 130 l-9 14 l9 52 l9 -52 z" fill="#8f1d1d"/>
  <!-- left arm pointing -->
  <path d="M56 160 Q22 150 14 112" stroke="#f2f0ea" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="14" cy="106" r="12" fill="#c98a5f"/>
  <rect x="10" y="78" width="9" height="30" rx="4" fill="#c98a5f"/>
  <!-- right arm with clipboard -->
  <path d="M164 160 Q192 176 188 206" stroke="#f2f0ea" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="188" cy="210" r="12" fill="#c98a5f"/>
  <rect x="176" y="176" width="40" height="52" rx="4" fill="#7a4b2a"/>
  <rect x="181" y="184" width="30" height="40" rx="2" fill="#fff"/>
  <path d="M185 192 h22 M185 200 h22 M185 208 h16" stroke="#9aa3ad" stroke-width="2"/>
  <rect x="188" y="172" width="16" height="8" rx="2" fill="#8a9099"/>
  <!-- neck -->
  <rect x="96" y="108" width="28" height="26" rx="8" fill="#b57a50"/>
  <!-- ears -->
  <circle cx="58" cy="84" r="10" fill="#c98a5f"/>
  <circle cx="162" cy="84" r="10" fill="#c98a5f"/>
  <!-- head -->
  <ellipse cx="110" cy="82" rx="50" ry="50" fill="#d29265"/>
  <!-- hair: slicked with a clear MAANG (parting) -->
  <path d="M60 74 Q56 30 110 30 Q164 30 160 74 Q150 52 130 50 L130 44 Q90 46 78 56 Q66 60 60 74 Z" fill="#1f1a17"/>
  <path d="M110 30 Q116 44 128 52" stroke="#d29265" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- the maang itself, ready to be filled -->
  <path d="M110 30 Q113 40 120 47" stroke="#f1ece4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- angry brows -->
  <path d="M72 70 L98 82" stroke="#1f1a17" stroke-width="6" stroke-linecap="round"/>
  <path d="M148 70 L122 82" stroke="#1f1a17" stroke-width="6" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="88" cy="90" rx="8" ry="9" fill="#fff"/>
  <ellipse cx="132" cy="90" rx="8" ry="9" fill="#fff"/>
  <circle cx="90" cy="91" r="4.5" fill="#1f1a17"/>
  <circle cx="130" cy="91" r="4.5" fill="#1f1a17"/>
  <!-- nose -->
  <path d="M110 92 q-7 14 0 18 q8 -2 5 -8" stroke="#a36a43" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- shouting mouth -->
  <ellipse cx="110" cy="124" rx="16" ry="11" fill="#5a1a1a"/>
  <path d="M97 119 h26 v5 h-26 z" fill="#fff"/>
  <ellipse cx="110" cy="130" rx="8" ry="4" fill="#c4505a"/>
  <!-- sweat -->
  <path d="M166 52 q6 10 0 16 q-6 -6 0 -16 z" fill="#8fd3ff"/>
</svg>
