<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>When in doubt, bhar do grout</title>
<meta name="description" content="When in doubt, bhar do grout. Unlimited Grout Simulator is coming live.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2a2523">
<link rel="canonical" href="https://shoonyaorigins.com/ventures/games/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shoonyaorigins.com/ventures/games/">
<meta property="og:title" content="When in doubt, bhar do grout">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="When in doubt, bhar do grout">
<style>
  :root {
    --bg: #f7f3ec;
    --ink: #2a2523;
    --tile: #ffffff;
    --tile-edge: #e6dfd3;
    --base: #2a2523;
    --grout: #c2570f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1816;
      --ink: #f4eee6;
      --tile: #efe9df;
      --tile-edge: #cfc6b8;
      --base: #0f0d0c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px 16px;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(2rem, 8vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    max-width: 14em;
  }
  h1 em { font-style: normal; color: var(--grout); }
  .board {
    width: min(100%, 520px);
    background: var(--base);
    border-radius: 20px;
    padding: 22px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .tile {
    aspect-ratio: 1.2 / 1;
    background: var(--tile);
    border: 1px solid var(--tile-edge);
    border-radius: 4px;
  }
  .board::after {
    content: "";
    position: absolute;
    inset: 22px;
    pointer-events: none;
    background:
      linear-gradient(var(--grout), var(--grout)) 33.3% 0 / 14px 100% no-repeat,
      linear-gradient(var(--grout), var(--grout)) 66.6% 0 / 14px 100% no-repeat,
      linear-gradient(var(--grout), var(--grout)) 0 50% / 100% 14px no-repeat;
    transform: translate(-7px, -7px);
    clip-path: inset(0 100% 0 0);
    animation: fill 4.5s ease-in-out infinite;
  }
  @keyframes fill {
    0%   { clip-path: inset(0 100% 0 0); }
    60%  { clip-path: inset(0 0 0 0); }
    90%  { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .board::after { animation: none; clip-path: inset(0 0 0 0); }
  }
</style>
</head>
<body>
  <h1>When in doubt, <em>bhar do grout</em></h1>
  <div class="board" role="img" aria-label="Tiles with grout filling the gaps">
    <div class="tile"></div><div class="tile"></div><div class="tile"></div>
    <div class="tile"></div><div class="tile"></div><div class="tile"></div>
  </div>
</body>
</html>
