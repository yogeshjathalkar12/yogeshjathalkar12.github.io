<!DOCTYPE html>

<title>Opening your vault | Vapus</title>
<script>
// This page used to be the dashboard. Sign-in links created back then (email confirmations, Google) still point HERE and
// bring the login in the address bar (#access_token=...). Redirecting straight to the app would throw that login away and
// show a second login form, so hand it to the callback page, which finishes the sign-in first.
(function () {
  var h = window.location.hash, s = window.location.search;
  if (/access_token=|error=|error_description=|[?&]code=/.test(h + s)) {
    window.location.replace('/ventures/aura/auth-callback.html' + s + h);
  } else {
    window.location.replace('/ventures/aura/app/#/timeline');
  }
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/ventures/aura/app/#/timeline"></noscript>
